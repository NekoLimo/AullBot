[project]
name = "aullbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ncatbot5>=5.5.6",
    "openai>=2.44.0",
    "openai-function-calling>=2.6.0",
    "requests>=2.34.2",
]

# ===== Pyright / basedpyright 配置 =====
[tool.basedpyright]
typeCheckingMode = "basic"
reportImportConvention = "none"
reportMissingTypeStubs = "none"
reportWildcardImportFromLibrary = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownReturnType = "none"

# ===== Ruff 配置 =====
[tool.ruff.lint]
ignore = ["E402", "F403", "F405"]

[project]
name = "aullbot"
version = "0.2.5a0"
description = "一个基于 NcatBot 的 QQ bot 框架"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bpi-py>=0.3.1",
    "fastapi>=0.141.1",
    "ncatbot5>=5.5.6",
    "openai>=2.44.0",
    "openai-function-calling>=2.6.0",
    "pillow>=12.3.0",
    "pydantic>=2.0",
    "requests>=2.34.2",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aullbot"]

# ===== Pyright / basedpyright 配置 =====
[tool.basedpyright]
typeCheckingMode = "basic"
reportImportConvention = "none"
reportMissingTypeStubs = "none"
reportWildcardImportFromLibrary = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownReturnType = "none"

# ===== Ruff 配置 =====
[tool.ruff.lint]
ignore = ["E402", "F403", "F405"]
